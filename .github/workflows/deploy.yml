name: Build and Deploy to EC2

on:
  push:
    branches: [feat/20250724]
  pull_request:
    branches: [feat/20250724]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.2.18'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run typecheck

      - name: Build application
        run: bun run build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/20250724'
    
    permissions:
      contents: read
      packages: write
      
    outputs:
      image_name: ${{ steps.set_image_name.outputs.image_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lower-case image name
        id: set_image_name
        run: echo "image_name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.set_image_name.outputs.image_name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=true

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/20250724'
    
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Stop/disable iptables to prevent conflicts with Docker networking
            sudo systemctl stop iptables || true
            sudo systemctl disable iptables || true
            sudo systemctl restart docker

            # Log in to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Stop and remove existing containers
            docker stop briend-app briend-nginx 2>/dev/null || true
            docker rm briend-app briend-nginx 2>/dev/null || true
            
            # Pull latest image
            docker pull ${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.image_name }}:latest
            
            # Run application container
            docker run -d \
              --name briend-app \
              --restart unless-stopped \
              -p 3000:3000 \
              -p 3001:3001 \
              -e NODE_ENV=production \
              ${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.image_name }}:latest
            
            # Clean up unused images
            docker image prune -af
            
            # Health check
            sleep 30
            curl -f http://localhost:3000/health || curl -f http://localhost:3000/ || exit 1