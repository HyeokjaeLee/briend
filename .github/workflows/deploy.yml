name: Build and Deploy to EC2 (Native)

on:
  push:
    branches: [feat/20250724]
  pull_request:
    branches: [feat/20250724]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.2.18'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run typecheck

      - name: Build application
        run: bun run build

      - name: Create deployment package
        run: |
          # 배포에 필요한 파일만 패키징
          mkdir -p deploy-package
          cp -r build deploy-package/
          cp package.json deploy-package/
          cp bun.lock deploy-package/
          cp server.ts deploy-package/
          cp -r scripts deploy-package/ || true
          
          # 압축
          tar -czf briend-build.tar.gz -C deploy-package .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: briend-build
          path: briend-build.tar.gz
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-24.04-arm
    if: github.ref == 'refs/heads/feat/20250724'
    
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: briend-build

      - name: Deploy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "briend-build.tar.gz"
          target: "/tmp/"

      - name: Execute deployment on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            APP_DIR="/home/ubuntu/briend"
            
            # Stop existing services
            sudo systemctl stop briend-app || true
            sudo systemctl stop briend-websocket || true
            
            # Backup current version
            if [ -d "$APP_DIR" ]; then
              cp -r "$APP_DIR" "${APP_DIR}-backup-$(date +%Y%m%d-%H%M%S)" || true
            fi
            
            # Create app directory if not exists
            mkdir -p "$APP_DIR"
            
            # Extract new build
            cd "$APP_DIR"
            tar -xzf /tmp/briend-build.tar.gz
            rm -f /tmp/briend-build.tar.gz
            
            # Install production dependencies only
            bun install --frozen-lockfile --production
            
            # Set permissions
            chmod +x scripts/*.sh || true
            
            # Start services
            sudo systemctl start briend-websocket
            sudo systemctl start briend-app
            sudo systemctl enable briend-app
            sudo systemctl enable briend-websocket
            
            # Health check
            sleep 10
            curl -f http://localhost:3000/health || curl -f http://localhost:3000/ || {
              echo "Health check failed. Checking service status:"
              sudo systemctl status briend-app
              sudo systemctl status briend-websocket
              sudo journalctl -u briend-app --lines=20
              exit 1
            }
            
            echo "Deployment successful!"