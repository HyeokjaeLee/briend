name: Build and Deploy to EC2

on:
  push:
    branches: [release/v3]
  pull_request:
    branches: [release/v3]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.2.18'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run typecheck

      - name: Build application
        run: bun run build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release/v3'
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release/v3'
    
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Log in to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Stop and remove existing containers
            docker-compose -f /home/${{ secrets.EC2_USER }}/briend/docker-compose.yml down || true
            
            # Pull latest image
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            # Update docker-compose.yml to use the new image
            sed -i 's|build:|#build:|g' /home/${{ secrets.EC2_USER }}/briend/docker-compose.yml
            sed -i 's|context: .|#context: .|g' /home/${{ secrets.EC2_USER }}/briend/docker-compose.yml
            sed -i 's|dockerfile: Dockerfile|#dockerfile: Dockerfile|g' /home/${{ secrets.EC2_USER }}/briend/docker-compose.yml
            sed -i '/briend-app:/a\    image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest' /home/${{ secrets.EC2_USER }}/briend/docker-compose.yml
            
            # Start services
            cd /home/${{ secrets.EC2_USER }}/briend
            docker-compose up -d
            
            # Clean up unused images
            docker image prune -af
            
            # Health check
            sleep 30
            curl -f http://localhost:3000/health || curl -f http://localhost:3000/ || exit 1